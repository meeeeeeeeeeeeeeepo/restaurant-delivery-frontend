# Render blueprint — frontend static site, production + staging.
services:
  - type: web
    name: restaurant-frontend-prod
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_AUTH_TOKEN
        sync: false            # GitHub Packages read token
      - key: VITE_API_URL
        sync: false            # URL of the production backend /graphql
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
  - type: web
    name: restaurant-frontend-staging
    runtime: static
    branch: develop
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_AUTH_TOKEN
        sync: false
      - key: VITE_API_URL
        sync: false            # URL of the staging backend /graphql
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
